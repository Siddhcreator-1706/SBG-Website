version: '3.8'

services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile.dev
    container_name: sbg-server-dev
    ports:
      - "3005:3005"
    env_file:
      - ./server/.env
    environment:
      - NODE_ENV=development
      - PORT=3005
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:5173,http://localhost:3005}
      - CLIENT_DIST_DIR=/app/client
    volumes:
      - ./server/src:/app/server/src
      - ./server/migrations:/app/server/migrations
      - server_node_modules:/app/server/node_modules
    develop:
      watch:
        - path: ./server/src
          action: rebuild
        - path: ./server/package.json
          action: rebuild
    restart: unless-stopped
    networks:
      - sbg-network

  client:
    build:
      context: ./client
      dockerfile: Dockerfile.dev
    container_name: sbg-client-dev
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:3005
    volumes:
      - ./client/src:/app/client/src
      - ./client/public:/app/client/public
      - client_node_modules:/app/client/node_modules
    develop:
      watch:
        - path: ./client/src
          action: rebuild
        - path: ./client/package.json
          action: rebuild
    restart: unless-stopped
    networks:
      - sbg-network

volumes:
  server_node_modules:
  client_node_modules:

networks:
  sbg-network:
    driver: bridge
