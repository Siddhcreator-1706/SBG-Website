version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - BUILD_ID=${BUILD_ID:-local-$(date +%s)}
    container_name: sbg-website
    ports:
      - "3005:3005"
    env_file:
      - ./server/.env
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=3005
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:3005}
      - CLIENT_DIST_DIR=/app/client
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3005', (r) => {if (r.statusCode !== 200) throw new Error(r.statusCode)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - sbg-network
    # Optional: Add volume for development hot-reload
    # volumes:
    #   - ./server/dist:/app/server/dist

networks:
  sbg-network:
    driver: bridge
